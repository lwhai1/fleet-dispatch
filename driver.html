<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>司机端 · 接送与送餐确认</title>
  <style>
    :root {
      --bg: #f3f5f8;
      --card: #ffffff;
      --text: #111827;
      --muted: #6b7280;
      --primary: #1d4ed8;
      --primary-soft: #eff6ff;
      --border: #e5e7eb;
      --success: #047857;
      --success-soft: #ecfdf5;
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
      background: var(--bg);
      color: var(--text);
      padding-bottom: 36px;
    }
    .topbar {
      position: sticky;
      top: 0;
      z-index: 20;
      background: #fff;
      border-bottom: 1px solid var(--border);
      padding: 12px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
    }
    .topbar-title { font-size: 17px; font-weight: 800; }
    .topbar-sub { font-size: 12px; color: var(--muted); }
    .container {
      max-width: 640px;
      margin: 14px auto;
      padding: 0 14px;
    }
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 16px;
      margin-bottom: 14px;
    }
    .input {
      width: 100%;
      padding: 12px;
      border: 1.5px solid #cbd5e1;
      border-radius: 10px;
      font-size: 16px;
      text-transform: uppercase;
      margin-bottom: 10px;
    }
    .btn {
      border: 1px solid var(--border);
      background: #fff;
      color: var(--text);
      border-radius: 10px;
      padding: 8px 12px;
      font-size: 13.5px;
      font-weight: 700;
      cursor: pointer;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
    }
    .btn-primary {
      width: 100%;
      padding: 12px;
      font-size: 16px;
      background: var(--primary);
      border-color: var(--primary);
      color: #fff;
    }
    .route-banner {
      background: var(--primary-soft);
      border: 1px solid #bfdbfe;
      border-radius: 12px;
      padding: 12px 14px;
      margin-bottom: 14px;
    }
    .route-banner-main {
      font-size: 18px;
      font-weight: 800;
      color: var(--primary);
    }
    .route-banner-sub {
      font-size: 13px;
      color: #1e3a8a;
      margin-top: 4px;
    }
    .schedule-highlight {
      margin-top: 8px;
      padding-top: 8px;
      border-top: 1px dashed #93c5fd;
      font-size: 14px;
      font-weight: 700;
      color: #0f172a;
    }
    .stop-card {
      background: #fff;
      border: 1.5px solid var(--border);
      border-radius: 14px;
      padding: 14px;
      margin-bottom: 12px;
    }
    .stop-title { font-size: 17px; font-weight: 800; }
    .stop-meta { font-size: 13.5px; color: #374151; margin-top: 5px; line-height: 1.45; }
    .quick-links {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-top: 10px;
    }
    .quick-btn {
      padding: 9px 10px;
      border-radius: 9px;
      font-size: 13.5px;
      font-weight: 700;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 5px;
      border: 1px solid #bfdbfe;
      background: var(--primary-soft);
      color: var(--primary);
    }
    .quick-btn.call-btn {
      border-color: #bbf7d0;
      background: #f0fdf4;
      color: #15803d;
    }
    .quick-btn.disabled {
      opacity: 0.45;
      pointer-events: none;
    }
    .tag {
      display: inline-block;
      margin-top: 8px;
      background: #fef2f2;
      color: #b91c1c;
      border: 1px solid #fecaca;
      font-size: 12px;
      font-weight: 600;
      padding: 2px 8px;
      border-radius: 6px;
    }
    .action-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-top: 12px;
    }
    .action-btn {
      padding: 13px 10px;
      border-radius: 11px;
      border: 1.5px solid #cbd5e1;
      background: #fff;
      color: #111827;
      font-size: 15px;
      font-weight: 800;
      cursor: pointer;
    }
    .action-btn.done {
      background: var(--success-soft);
      border-color: #10b981;
      color: var(--success);
    }
    .toast {
      position: fixed;
      bottom: 18px;
      left: 50%;
      transform: translateX(-50%);
      background: #111827;
      color: #fff;
      padding: 10px 16px;
      border-radius: 10px;
      font-size: 13.5px;
      z-index: 60;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s ease;
      white-space: nowrap;
    }
    .toast.show { opacity: 1; }
  </style>
</head>
<body>
  <header class="topbar">
    <div>
      <div class="topbar-title">司机端任务清单</div>
      <div class="topbar-sub" id="driverSubInfo">请先输入登录代码</div>
    </div>
    <div id="topbarActions" style="display:none;gap:6px;">
      <button class="btn" onclick="manualRefresh()">刷新更新</button>
      <button class="btn" onclick="logoutDriver()">切换登录</button>
    </div>
  </header>

  <div class="container">
    <section class="card" id="loginCard">
      <h2 style="margin:0 0 8px;font-size:18px;">输入司机专用登录代码</h2>
      <p style="margin:0 0 12px;font-size:13px;color:var(--muted);">
        输入调度员分配给您的登录代码（例如 <code>CHEN01</code>）查看当前指派线路、发车时间与站点。
      </p>
      <input class="input" id="driverCodeInput" placeholder="请输入登录代码，例如 CHEN01" autocomplete="off" />
      <button class="btn btn-primary" onclick="loginByCode()">登录并查看任务</button>
      <div id="loginError" style="color:#b91c1c;font-size:13px;margin-top:8px;"></div>
    </section>

    <div id="taskWorkspace" style="display:none;"></div>
  </div>

  <div class="toast" id="toast"></div>

  <script src="./firebase-config.js"></script>
  <script>
    const SESSION_KEY = 'fleet_driver_session_code_v1';
    let state = null;
    let currentDriver = null;

    function showToast(msg) {
      const el = document.getElementById('toast');
      el.textContent = msg;
      el.classList.add('show');
      clearTimeout(window.__drvToast);
      window.__drvToast = setTimeout(() => el.classList.remove('show'), 2000);
    }

    function formatShortTime(iso) {
      if (!iso) return '';
      return new Date(iso).toLocaleTimeString('zh-CN', { hour12: false });
    }

    function getTodayDateStr() {
      const now = new Date();
      const y = now.getFullYear();
      const m = String(now.getMonth() + 1).padStart(2, '0');
      const d = String(now.getDate()).padStart(2, '0');
      return `${y}-${m}-${d}`;
    }

    function formatScheduleDisplay(route) {
      const dateStr = (route && route.dispatchDate) || getTodayDateStr();
      const timeStr = (route && route.departureTime) || '08:00';
      return `${dateStr} · 发车时间 ${timeStr}`;
    }

    function buildTelHref(phone) {
      const cleaned = (phone || '').replace(/[^\d+]/g, '');
      return cleaned ? `tel:${cleaned}` : '';
    }

    function buildNavHref(address) {
      const q = (address || '').trim();
      if (!q) return '';
      return `https://www.google.com/maps/dir/?api=1&destination=${encodeURIComponent(q)}`;
    }

    function findDriverByCode(code) {
      const normalized = (code || '').trim().toUpperCase();
      if (!normalized || !state || !Array.isArray(state.drivers)) return null;
      return state.drivers.find(d => (d.code || '').trim().toUpperCase() === normalized) || null;
    }

    async function loginByCode() {
      const input = document.getElementById('driverCodeInput');
      const errEl = document.getElementById('loginError');
      const matched = findDriverByCode(input.value);
      if (!matched) {
        errEl.textContent = '未找到该登录代码，请核对后重试或联系调度员。';
        return;
      }
      errEl.textContent = '';
      currentDriver = matched;
      sessionStorage.setItem(SESSION_KEY, matched.code);
      renderWorkspace();
      showToast(`欢迎，${matched.name}`);
    }

    function logoutDriver() {
      currentDriver = null;
      sessionStorage.removeItem(SESSION_KEY);
      document.getElementById('topbarActions').style.display = 'none';
      document.getElementById('taskWorkspace').style.display = 'none';
      document.getElementById('loginCard').style.display = 'block';
      document.getElementById('driverSubInfo').textContent = '请先输入登录代码';
      document.getElementById('driverCodeInput').value = '';
    }

    async function manualRefresh() {
      state = await window.FleetSync.loadState();
      if (currentDriver) {
        currentDriver = state.drivers.find(d => d.id === currentDriver.id) || null;
      }
      renderWorkspace();
      showToast('已刷新线路与发车时间');
    }

    async function toggleStopFlag(routeId, stopIndex, field) {
      const route = state.routes.find(r => r.id === routeId);
      if (!route || !route.stops || !route.stops[stopIndex]) return;
      const stop = route.stops[stopIndex];
      stop[field] = !stop[field];
      stop.updatedAt = new Date().toISOString();
      state = await window.FleetSync.saveState(state);
      renderWorkspace();
      if (field === 'pickedUp') {
        showToast(stop.pickedUp ? '已确认接送' : '已取消接送确认');
      } else {
        showToast(stop.mealDelivered ? '已确认餐食送达' : '已取消送餐确认');
      }
    }

    function renderWorkspace() {
      if (!currentDriver) return;
      document.getElementById('loginCard').style.display = 'none';
      document.getElementById('topbarActions').style.display = 'flex';
      document.getElementById('driverSubInfo').textContent =
        `${currentDriver.name}（${currentDriver.code}）· ${window.FleetSync.ENABLE_FIREBASE ? '云端同步已开启' : '本地同步模式'}`;

      const workspace = document.getElementById('taskWorkspace');
      workspace.style.display = 'block';

      const assignedRoutes = (state.routes || []).filter(r => r.assignedDriverId === currentDriver.id);
      if (assignedRoutes.length === 0) {
        workspace.innerHTML = `
          <div class="card" style="text-align:center;padding:28px 16px;">
            <div style="font-size:16px;font-weight:700;margin-bottom:6px;">当前暂未指派线路</div>
            <div style="font-size:13px;color:var(--muted);">调度员指派线路与发车时间后，可点击右上角「刷新更新」查看。</div>
          </div>
        `;
        return;
      }

      const memberMap = new Map((state.members || []).map(m => [m.id, m]));

      workspace.innerHTML = assignedRoutes.map(route => {
        const stops = route.stops || [];
        const stopsHtml = stops.length === 0
          ? `<div class="card" style="text-align:center;color:var(--muted);">当前线路暂无接送或送餐站点</div>`
          : stops.map((stop, idx) => {
              const m = memberMap.get(stop.memberId);
              if (!m) return '';
              const telHref = buildTelHref(m.phone);
              const navHref = buildNavHref(m.address);

              return `
                <div class="stop-card">
                  <div style="display:flex;justify-content:space-between;align-items:center;">
                    <span class="stop-title">#${idx + 1} ${m.name}</span>
                    <span style="font-size:12px;color:var(--muted);">${stop.updatedAt ? '更新 ' + formatShortTime(stop.updatedAt) : ''}</span>
                  </div>
                  <div class="stop-meta"><strong>地址：</strong>${m.address || '-'}</div>
                  <div class="stop-meta"><strong>电话：</strong>${m.phone || '-'}</div>

                  <div class="quick-links">
                    <a class="quick-btn call-btn ${telHref ? '' : 'disabled'}" href="${telHref || '#'}">
                      📞 一键呼叫
                    </a>
                    <a class="quick-btn ${navHref ? '' : 'disabled'}" href="${navHref || '#'}" target="_blank" rel="noopener noreferrer">
                      🧭 一键导航
                    </a>
                  </div>

                  ${m.specialNeeds ? `<div class="tag">特殊需要：${m.specialNeeds}</div>` : ''}
                  ${m.notes ? `<div class="stop-meta" style="color:#4b5563;"><strong>备注：</strong>${m.notes}</div>` : ''}

                  <div class="action-grid">
                    <button class="action-btn ${stop.pickedUp ? 'done' : ''}" onclick="toggleStopFlag('${route.id}', ${idx}, 'pickedUp')">
                      ${stop.pickedUp ? '✓ 已接送' : '确认已接送'}
                    </button>
                    <button class="action-btn ${stop.mealDelivered ? 'done' : ''}" onclick="toggleStopFlag('${route.id}', ${idx}, 'mealDelivered')">
                      ${stop.mealDelivered ? '✓ 餐食已送达' : '餐食已送达'}
                    </button>
                  </div>
                </div>
              `;
            }).join('');

        return `
          <div class="route-banner">
            <div class="route-banner-main">${route.lineName} · ${route.vehicleNo || '未指定车辆'}</div>
            <div class="route-banner-sub">执勤司机：${currentDriver.name} · 共 ${stops.length} 个站点</div>
            <div class="schedule-highlight">📅 日期与发车时间：${formatScheduleDisplay(route)}</div>
          </div>
          ${stopsHtml}
        `;
      }).join('');
    }

    (async function init() {
      state = await window.FleetSync.loadState();
      const savedCode = sessionStorage.getItem(SESSION_KEY);
      if (savedCode) {
        const matched = findDriverByCode(savedCode);
        if (matched) {
          currentDriver = matched;
          renderWorkspace();
        }
      }

      window.FleetSync.onRemoteChange((latest) => {
        state = latest;
        if (currentDriver) {
          currentDriver = state.drivers.find(d => d.id === currentDriver.id) || currentDriver;
          renderWorkspace();
          showToast('线路或发车时间已同步更新');
        }
      });
    })();
  </script>
</body>
</html>
