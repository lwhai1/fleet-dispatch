<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>司机端 · 接送与送餐确认</title>
  <style>
    :root {
      --bg: #f3f5f8;
      --card: #ffffff;
      --text: #111827;
      --muted: #6b7280;
      --primary: #1d4ed8;
      --primary-soft: #eff6ff;
      --border: #e5e7eb;
      --success: #047857;
      --success-soft: #ecfdf5;
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
      background: var(--bg);
      color: var(--text);
      padding-bottom: 36px;
    }
    .auth-overlay {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }
    .auth-card {
      width: 100%;
      max-width: 400px;
      background: #fff;
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 22px;
      box-shadow: 0 10px 25px rgba(15, 23, 42, 0.06);
    }
    .form-group { margin-bottom: 12px; }
    .form-group label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      margin-bottom: 4px;
      color: #374151;
    }
    .topbar {
      position: sticky;
      top: 0;
      z-index: 20;
      background: #fff;
      border-bottom: 1px solid var(--border);
      padding: 12px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
    }
    .topbar-title { font-size: 17px; font-weight: 800; }
    .topbar-sub { font-size: 12px; color: var(--muted); }
    .container {
      max-width: 640px;
      margin: 14px auto;
      padding: 0 14px;
    }
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 14px;
      margin-bottom: 14px;
    }
    .input, .select {
      width: 100%;
      padding: 10px 12px;
      border: 1.5px solid #cbd5e1;
      border-radius: 10px;
      font-size: 15px;
      background: #fff;
    }
    .btn {
      border: 1px solid var(--border);
      background: #fff;
      color: var(--text);
      border-radius: 10px;
      padding: 8px 11px;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
    }
    .btn-primary {
      width: 100%;
      padding: 12px;
      font-size: 16px;
      background: var(--primary);
      border-color: var(--primary);
      color: #fff;
    }
    .route-banner {
      background: var(--primary-soft);
      border: 1px solid #bfdbfe;
      border-radius: 12px;
      padding: 12px 14px;
      margin-bottom: 14px;
    }
    .route-banner-main {
      font-size: 18px;
      font-weight: 800;
      color: var(--primary);
    }
    .route-banner-sub {
      font-size: 13px;
      color: #1e3a8a;
      margin-top: 4px;
    }
    .schedule-highlight {
      margin-top: 8px;
      padding-top: 8px;
      border-top: 1px dashed #93c5fd;
      font-size: 14px;
      font-weight: 700;
      color: #0f172a;
    }
    .stop-card {
      background: #fff;
      border: 1.5px solid var(--border);
      border-radius: 14px;
      padding: 14px;
      margin-bottom: 12px;
    }
    .stop-title { font-size: 17px; font-weight: 800; }
    .stop-meta { font-size: 13.5px; color: #374151; margin-top: 5px; line-height: 1.45; }
    .tag {
      display: inline-block;
      margin-top: 6px;
      background: #fef2f2;
      color: #b91c1c;
      border: 1px solid #fecaca;
      font-size: 12px;
      font-weight: 600;
      padding: 2px 8px;
      border-radius: 6px;
    }
    .four-btn-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-top: 12px;
    }
    .quick-btn {
      padding: 12px 10px;
      border-radius: 11px;
      font-size: 14.5px;
      font-weight: 800;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 5px;
      border: 1.5px solid #bfdbfe;
      background: var(--primary-soft);
      color: var(--primary);
    }
    .quick-btn.call-btn {
      border-color: #bbf7d0;
      background: #f0fdf4;
      color: #15803d;
    }
    .quick-btn.disabled {
      opacity: 0.45;
      pointer-events: none;
    }
    .action-btn {
      padding: 13px 10px;
      border-radius: 11px;
      border: 1.5px solid #cbd5e1;
      background: #fff;
      color: #111827;
      font-size: 15px;
      font-weight: 800;
      cursor: pointer;
    }
    .action-btn.done {
      background: var(--success-soft);
      border-color: #10b981;
      color: var(--success);
    }
    .error-text {
      color: #b91c1c;
      font-size: 13px;
      margin-top: 8px;
      min-height: 18px;
    }
    .toast {
      position: fixed;
      bottom: 18px;
      left: 50%;
      transform: translateX(-50%);
      background: #111827;
      color: #fff;
      padding: 10px 16px;
      border-radius: 10px;
      font-size: 13.5px;
      z-index: 60;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s ease;
      white-space: nowrap;
    }
    .toast.show { opacity: 1; }
  </style>
</head>
<body>
  <div class="auth-overlay" id="driverAuthScreen">
    <div class="auth-card">
      <h2 style="margin:0 0 6px;font-size:20px;font-weight:800;">司机端登录</h2>
      <p style="margin:0 0 14px;font-size:13px;color:var(--muted);line-height:1.5;">
        请使用已授权的邮箱与密码登录，查看线路、发车时间与站点任务。
      </p>
      <form id="driverAuthForm">
        <div class="form-group">
          <label for="dEmail">登录邮箱</label>
          <input class="input" type="email" id="dEmail" required autocomplete="username" placeholder="driver@example.com" />
        </div>
        <div class="form-group">
          <label for="dPassword">登录密码</label>
          <input class="input" type="password" id="dPassword" required autocomplete="current-password" placeholder="请输入密码" />
        </div>
        <button class="btn btn-primary" type="submit" id="dLoginBtn">登录并查看任务</button>
        <div class="error-text" id="dAuthError"></div>
      </form>
    </div>
  </div>

  <div id="driverAppShell" style="display:none;">
    <header class="topbar">
      <div>
        <div class="topbar-title">司机端任务清单</div>
        <div class="topbar-sub" id="driverSubInfo">已登录</div>
      </div>
      <div style="display:flex;gap:6px;">
        <button type="button" class="btn" id="refreshBtn">刷新更新</button>
        <button type="button" class="btn" id="logoutBtn">退出登录</button>
      </div>
    </header>

    <div class="container">
      <div class="card" style="padding:10px 12px;">
        <label for="driverSelect" style="display:block;font-size:12px;color:var(--muted);font-weight:700;margin-bottom:4px;">
          当前执勤司机身份
        </label>
        <select class="select" id="driverSelect"></select>
      </div>

      <div id="taskWorkspace"></div>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
  <script src="./firebase-config.js"></script>
  <script>
    const DB_ROOT_PATH = 'fleetDispatchState';
    const DRIVER_PICK_KEY = 'fleet_driver_selected_id_v1';

    let auth = null;
    let db = null;
    let dbRef = null;
    let state = null;
    let currentUser = null;
    let selectedDriverId = '';
    let isSubscribed = false;
    let toastTimer = null;

    function escapeHtml(str) {
      return String(str ?? '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    function escapeAttr(str) {
      return escapeHtml(str);
    }

    function showToast(msg) {
      const el = document.getElementById('toast');
      if (!el) return;
      el.textContent = msg;
      el.classList.add('show');
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => el.classList.remove('show'), 2000);
    }

    function ensureFirebaseReady() {
      if (auth && db) return true;

      const fs = window.FleetSync || {};
      const rawCfg =
        window.FIREBASE_CONFIG ||
        fs.FIREBASE_CONFIG ||
        fs.firebaseConfig ||
        fs.config ||
        (firebase.apps.length && firebase.app().options) ||
        {};

      const cfg = {
        apiKey: rawCfg.apiKey,
        authDomain: rawCfg.authDomain || 'fleet-dispatch-tx.firebaseapp.com',
        databaseURL:
          rawCfg.databaseURL ||
          'https://fleet-dispatch-tx-default-rtdb.firebaseio.com',
        projectId: rawCfg.projectId || 'fleet-dispatch-tx',
        storageBucket: rawCfg.storageBucket,
        messagingSenderId: rawCfg.messagingSenderId,
        appId: rawCfg.appId
      };

      if (!cfg.apiKey || cfg.apiKey === 'YOUR_FIREBASE_API_KEY') {
        document.getElementById('dAuthError').textContent =
          '未检测到有效的 Firebase apiKey，请先在 firebase-config.js 中填入真实配置。';
        return false;
      }

      if (!firebase.apps.length) {
        firebase.initializeApp(cfg);
      }
      auth = firebase.auth();
      db = firebase.database();
      dbRef = db.ref(DB_ROOT_PATH);
      return true;
    }

    function getTodayDateStr() {
      const now = new Date();
      const y = now.getFullYear();
      const m = String(now.getMonth() + 1).padStart(2, '0');
      const d = String(now.getDate()).padStart(2, '0');
      return `${y}-${m}-${d}`;
    }

    function normalizeState(raw) {
      const next = Object.assign({ drivers: [], members: [], routes: [] }, raw || {});
      next.drivers = Array.isArray(next.drivers) ? next.drivers : [];
      next.members = Array.isArray(next.members) ? next.members : [];
      next.routes = Array.isArray(next.routes) ? next.routes : [];
      const defaultDate = getTodayDateStr();
      next.routes.forEach(r => {
        if (!r.dispatchDate) r.dispatchDate = defaultDate;
        if (!r.departureTime) r.departureTime = '08:00';
        if (!Array.isArray(r.stops)) r.stops = [];
      });
      return next;
    }

    function formatShortTime(iso) {
      if (!iso) return '';
      return new Date(iso).toLocaleTimeString('zh-CN', { hour12: false });
    }

    function formatScheduleDisplay(route) {
      const dateStr = (route && route.dispatchDate) || getTodayDateStr();
      const timeStr = (route && route.departureTime) || '08:00';
      return `${dateStr} · 发车时间 ${timeStr}`;
    }

    function buildTelHref(phone) {
      const cleaned = (phone || '').replace(/[^\d+]/g, '');
      return cleaned ? `tel:${cleaned}` : '';
    }

    function buildNavHref(address) {
      const q = (address || '').trim();
      if (!q) return '';
      return `https://www.google.com/maps/dir/?api=1&destination=${encodeURIComponent(q)}`;
    }

    async function loadCloudState() {
      const snap = await dbRef.once('value');
      return normalizeState(snap.val());
    }

    async function saveCloudState(msg) {
      state = normalizeState(state);
      state.updatedAt = new Date().toISOString();
      await dbRef.set(state);
      renderWorkspace();
      if (msg) showToast(msg);
    }

    function syncDriverSelector() {
      const select = document.getElementById('driverSelect');
      const drivers = (state && state.drivers) || [];
      if (!drivers.length) {
        select.innerHTML = `<option value="">暂无司机档案</option>`;
        selectedDriverId = '';
        return;
      }

      if (!selectedDriverId) {
        try {
          selectedDriverId = sessionStorage.getItem(DRIVER_PICK_KEY) || '';
        } catch (_) {}
      }
      if (!drivers.some(d => d.id === selectedDriverId)) {
        selectedDriverId = drivers[0].id;
      }

      select.innerHTML = drivers.map(d =>
        `<option value="${escapeAttr(d.id)}" ${d.id === selectedDriverId ? 'selected' : ''}>${escapeHtml(d.name || '')}</option>`
      ).join('');
    }

    async function toggleStopFlag(routeId, stopIndex, field) {
      const route = state.routes.find(r => r.id === routeId);
      if (!route || !route.stops || !route.stops[stopIndex]) return;
      const stop = route.stops[stopIndex];
      stop[field] = !stop[field];
      stop.updatedAt = new Date().toISOString();
      await saveCloudState(field === 'pickedUp'
        ? (stop.pickedUp ? '已确认接送' : '已取消接送确认')
        : (stop.mealDelivered ? '已确认餐食送达' : '已取消送餐确认'));
    }

    function renderWorkspace() {
      if (!state) return;
      syncDriverSelector();

      const driver = (state.drivers || []).find(d => d.id === selectedDriverId) || null;
      document.getElementById('driverSubInfo').textContent =
        (currentUser && currentUser.email ? currentUser.email : '已认证账号') +
        (driver ? ` · ${driver.name}` : '');

      const workspace = document.getElementById('taskWorkspace');
      if (!driver) {
        workspace.innerHTML = `<div class="card" style="text-align:center;color:var(--muted);">请选择执勤司机或等待调度员配置</div>`;
        return;
      }

      const assignedRoutes = (state.routes || []).filter(r => r.assignedDriverId === driver.id);
      if (assignedRoutes.length === 0) {
        workspace.innerHTML = `
          <div class="card" style="text-align:center;padding:28px 16px;">
            <div style="font-size:16px;font-weight:700;margin-bottom:6px;">当前暂未指派线路</div>
            <div style="font-size:13px;color:var(--muted);">调度员指派线路与发车时间后，可点右上角「刷新更新」。</div>
          </div>
        `;
        return;
      }

      const memberMap = new Map((state.members || []).map(m => [m.id, m]));

      workspace.innerHTML = assignedRoutes.map(route => {
        const stops = route.stops || [];
        const stopsHtml = stops.length === 0
          ? `<div class="card" style="text-align:center;color:var(--muted);">当前线路暂无接送或送餐站点</div>`
          : stops.map((stop, idx) => {
              const m = memberMap.get(stop.memberId);
              if (!m) return '';
              const telHref = buildTelHref(m.phone);
              const navHref = buildNavHref(m.address);

              return `
                <div class="stop-card">
                  <div style="display:flex;justify-content:space-between;align-items:center;">
                    <span class="stop-title">#${idx + 1} ${escapeHtml(m.name || '')}</span>
                    <span style="font-size:12px;color:var(--muted);">${stop.updatedAt ? '更新 ' + escapeHtml(formatShortTime(stop.updatedAt)) : ''}</span>
                  </div>
                  <div class="stop-meta"><strong>地址：</strong>${escapeHtml(m.address || '-')}</div>
                  <div class="stop-meta"><strong>电话：</strong>${escapeHtml(m.phone || '-')}</div>
                  ${m.specialNeeds ? `<div class="tag">特殊需要：${escapeHtml(m.specialNeeds)}</div>` : ''}
                  ${m.notes ? `<div class="stop-meta" style="color:#4b5563;"><strong>备注：</strong>${escapeHtml(m.notes)}</div>` : ''}

                  <div class="four-btn-grid">
                    <a class="quick-btn call-btn ${telHref ? '' : 'disabled'}" href="${escapeAttr(telHref || '#')}">📞 一键呼叫</a>
                    <a class="quick-btn ${navHref ? '' : 'disabled'}" href="${escapeAttr(navHref || '#')}" target="_blank" rel="noopener noreferrer">🧭 一键导航</a>
                    <button type="button" class="action-btn ${stop.pickedUp ? 'done' : ''}" data-action="toggle" data-route-id="${escapeAttr(route.id)}" data-stop-index="${idx}" data-field="pickedUp">
                      ${stop.pickedUp ? '✓ 已接送' : '确认已接送'}
                    </button>
                    <button type="button" class="action-btn ${stop.mealDelivered ? 'done' : ''}" data-action="toggle" data-route-id="${escapeAttr(route.id)}" data-stop-index="${idx}" data-field="mealDelivered">
                      ${stop.mealDelivered ? '✓ 餐食已送达' : '餐食已送达'}
                    </button>
                  </div>
                </div>
              `;
            }).join('');

        return `
          <div class="route-banner">
            <div class="route-banner-main">${escapeHtml(route.lineName)} · ${escapeHtml(route.vehicleNo || '未指定车辆')}</div>
            <div class="route-banner-sub">执勤司机：${escapeHtml(driver.name)} · 共 ${stops.length} 个站点</div>
            <div class="schedule-highlight">📅 日期与发车时间：${escapeHtml(formatScheduleDisplay(route))}</div>
          </div>
          ${stopsHtml}
        `;
      }).join('');
    }

    document.getElementById('driverAuthForm').addEventListener('submit', async function (e) {
      e.preventDefault();
      const errEl = document.getElementById('dAuthError');
      const btn = document.getElementById('dLoginBtn');
      errEl.textContent = '';
      if (!ensureFirebaseReady()) return;

      const email = document.getElementById('dEmail').value.trim();
      const password = document.getElementById('dPassword').value;
      btn.disabled = true;
      btn.textContent = '登录中...';
      try {
        await auth.signInWithEmailAndPassword(email, password);
      } catch (err) {
        errEl.textContent = '登录失败：请检查邮箱或密码是否正确（' + (err && err.code ? err.code : '认证错误') + '）。';
      } finally {
        btn.disabled = false;
        btn.textContent = '登录并查看任务';
      }
    });

    document.getElementById('driverSelect').addEventListener('change', function (e) {
      selectedDriverId = e.target.value;
      try {
        sessionStorage.setItem(DRIVER_PICK_KEY, selectedDriverId);
      } catch (_) {}
      renderWorkspace();
    });

    document.getElementById('refreshBtn').addEventListener('click', async function () {
      state = await loadCloudState();
      renderWorkspace();
      showToast('已刷新线路与发车时间');
    });

    document.getElementById('logoutBtn').addEventListener('click', async function () {
      if (auth) await auth.signOut();
    });

    document.getElementById('taskWorkspace').addEventListener('click', function (e) {
      const toggleBtn = e.target.closest('button[data-action="toggle"]');
      if (!toggleBtn) return;
      toggleStopFlag(
        toggleBtn.getAttribute('data-route-id'),
        Number(toggleBtn.getAttribute('data-stop-index')),
        toggleBtn.getAttribute('data-field')
      );
    });

    (function initAuthWatcher() {
      if (!ensureFirebaseReady()) return;
      auth.onAuthStateChanged(async (user) => {
        currentUser = user || null;
        if (!user) {
          document.getElementById('driverAppShell').style.display = 'none';
          document.getElementById('driverAuthScreen').style.display = 'flex';
          return;
        }
        document.getElementById('driverAuthScreen').style.display = 'none';
        document.getElementById('driverAppShell').style.display = 'block';

        try {
          state = await loadCloudState();
          renderWorkspace();
          if (!isSubscribed) {
            isSubscribed = true;
            dbRef.on('value', (snap) => {
              const val = snap.val();
              if (!val) return;
              state = normalizeState(val);
              renderWorkspace();
            });
          }
        } catch (err) {
          showToast('读取云端数据失败，请检查数据库规则');
        }
      });
    })();
  </script>
</body>
</html>
