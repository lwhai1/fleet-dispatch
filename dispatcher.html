<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>调度员端 · 线路、车辆（1–9号车）与司机指派管理</title>
  <style>
    :root {
      --bg: #f3f5f8;
      --card: #ffffff;
      --text: #111827;
      --muted: #6b7280;
      --primary: #1d4ed8;
      --primary-soft: #eff6ff;
      --border: #e5e7eb;
      --success: #047857;
      --success-soft: #ecfdf5;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
      background: var(--bg);
      color: var(--text);
      padding-bottom: 40px;
    }
    .auth-overlay {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 18px;
    }
    .auth-card {
      width: 100%;
      max-width: 400px;
      background: #fff;
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 24px;
      box-shadow: 0 10px 25px rgba(15, 23, 42, 0.06);
    }
    .auth-title { margin: 0 0 6px; font-size: 20px; font-weight: 800; }
    .auth-sub { margin: 0 0 16px; font-size: 13px; color: var(--muted); line-height: 1.5; }
    .topbar {
      background: #fff;
      border-bottom: 1px solid var(--border);
      padding: 14px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 10px;
    }
    .topbar h1 { margin: 0; font-size: 19px; }
    .topbar-meta { font-size: 13px; color: var(--muted); }
    .layout {
      max-width: 1420px;
      margin: 18px auto;
      padding: 0 18px;
      display: grid;
      grid-template-columns: 360px 1fr;
      gap: 18px;
      align-items: start;
    }
    .left-sticky {
      position: sticky;
      top: 16px;
      max-height: calc(100vh - 32px);
      display: flex;
      flex-direction: column;
      gap: 14px;
    }
    @media (max-width: 980px) {
      .layout { grid-template-columns: 1fr; }
      .left-sticky {
        position: static;
        max-height: none;
      }
    }
    .panel {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 16px;
      margin-bottom: 0;
    }
    .pool-panel {
      display: flex;
      flex-direction: column;
      min-height: 220px;
      max-height: 46vh;
      overflow: hidden;
    }
    .pool-scroll {
      overflow-y: auto;
      padding-right: 4px;
      flex: 1;
    }
    .panel-title {
      margin: 0 0 12px;
      font-size: 16px;
      font-weight: 700;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px;
    }
    .toolbar-row {
      background: #f8fafc;
      border: 1px solid #e2e8f0;
      border-radius: 10px;
      padding: 10px 12px;
      margin-bottom: 12px;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }
    .toolbar-group {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 8px;
    }
    .toolbar-row label {
      font-size: 12.5px;
      font-weight: 600;
      color: #334155;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .driver-manager-box {
      background: #f9fafb;
      border: 1px solid #e5e7eb;
      border-radius: 10px;
      padding: 12px;
      margin-bottom: 14px;
    }
    .driver-add-row {
      display: flex;
      gap: 8px;
      margin-bottom: 10px;
      flex-wrap: wrap;
    }
    .driver-list-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 8px;
    }
    .driver-item {
      background: #fff;
      border: 1px solid #e5e7eb;
      border-radius: 8px;
      padding: 7px 9px;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .form-group { margin-bottom: 10px; }
    .form-group label {
      display: block;
      font-size: 12.5px;
      font-weight: 600;
      margin-bottom: 4px;
      color: #374151;
    }
    .input, .select {
      width: 100%;
      padding: 8px 10px;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      font-size: 13.5px;
      background: #fff;
    }
    .input-sm {
      width: auto;
      padding: 6px 8px;
      font-size: 12.5px;
    }
    .btn {
      border: 1px solid var(--border);
      background: #fff;
      color: var(--text);
      border-radius: 8px;
      padding: 7px 11px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      text-decoration: none;
      display: inline-block;
    }
    .btn-primary {
      background: var(--primary);
      border-color: var(--primary);
      color: #fff;
    }
    .btn-block {
      width: 100%;
      padding: 11px;
      font-size: 15px;
    }
    .btn-danger {
      color: #b91c1c;
      border-color: #fecaca;
      background: #fef2f2;
    }
    .search-box {
      display: flex;
      gap: 6px;
      margin-bottom: 10px;
      align-items: center;
    }
    .member-card {
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 10px 12px;
      margin-bottom: 10px;
      background: #fafafa;
      cursor: grab;
    }
    .member-card:active { cursor: grabbing; }
    .member-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-weight: 700;
      font-size: 14.5px;
    }
    .route-status-badge {
      display: inline-block;
      margin-top: 5px;
      margin-right: 6px;
      font-size: 11.5px;
      font-weight: 600;
      padding: 2px 8px;
      border-radius: 999px;
    }
    .route-status-badge.assigned {
      background: var(--primary-soft);
      color: var(--primary);
      border: 1px solid #bfdbfe;
    }
    .route-status-badge.self-transport {
      background: var(--success-soft);
      color: var(--success);
      border: 1px solid #a7f3d0;
    }
    .route-status-badge.unassigned {
      background: #f3f4f6;
      color: #6b7280;
      border: 1px solid #e5e7eb;
    }
    .tag {
      display: inline-block;
      margin-top: 5px;
      background: #fef2f2;
      color: #b91c1c;
      border: 1px solid #fecaca;
      font-size: 11.5px;
      padding: 2px 7px;
      border-radius: 5px;
    }
    .member-detail {
      font-size: 12.5px;
      color: #4b5563;
      margin-top: 4px;
      line-height: 1.4;
    }
    .member-actions {
      margin-top: 8px;
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
    }
    .routes-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
      gap: 14px;
    }
    .route-card {
      border: 1.5px solid var(--border);
      border-radius: 12px;
      padding: 12px;
      background: #fff;
      transition: border-color 0.15s ease, background 0.15s ease;
    }
    .route-card.drag-over {
      border-color: var(--primary);
      background: var(--primary-soft);
    }
    .route-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      margin-bottom: 10px;
      padding-bottom: 8px;
      border-bottom: 1px solid #f1f5f9;
    }
    .route-name { font-size: 16px; font-weight: 800; color: var(--primary); }
    .schedule-controls {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-bottom: 8px;
      background: #f9fafb;
      padding: 8px;
      border-radius: 8px;
      border: 1px solid #eef2f6;
    }
    .assign-controls {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-bottom: 10px;
    }
    .stop-item {
      border: 1px solid #e5e7eb;
      background: #f9fafb;
      border-radius: 8px;
      padding: 8px 10px;
      margin-bottom: 8px;
    }
    .stop-item-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 6px;
      font-weight: 700;
      font-size: 13.5px;
    }
    .status-row {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 6px;
      margin-top: 6px;
    }
    .status-pill {
      font-size: 11.5px;
      padding: 2px 7px;
      border-radius: 999px;
      background: #e5e7eb;
      color: #374151;
      display: inline-block;
    }
    .status-pill.ok {
      background: var(--success-soft);
      color: var(--success);
      font-weight: 600;
    }
    .error-text {
      color: #b91c1c;
      font-size: 13px;
      margin-top: 8px;
      min-height: 18px;
    }
    .toast {
      position: fixed;
      bottom: 18px;
      right: 18px;
      background: #111827;
      color: #fff;
      padding: 10px 16px;
      border-radius: 10px;
      font-size: 13px;
      z-index: 50;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s ease;
    }
    .toast.show { opacity: 1; }
  </style>
</head>
<body>
  <div class="auth-overlay" id="authScreen">
    <div class="auth-card">
      <h2 class="auth-title">调度员端登录</h2>
      <p class="auth-sub">请使用 Firebase 后台已创建的邮箱与密码登录，未授权账号无法访问排班与长者信息。</p>
      <form id="dispatcherLoginForm">
        <div class="form-group">
          <label for="loginEmail">登录邮箱</label>
          <input class="input" type="email" id="loginEmail" required autocomplete="username" placeholder="dispatcher@example.com" />
        </div>
        <div class="form-group">
          <label for="loginPassword">登录密码</label>
          <input class="input" type="password" id="loginPassword" required autocomplete="current-password" placeholder="请输入密码" />
        </div>
        <button class="btn btn-primary btn-block" type="submit" id="loginSubmitBtn">登录调度员端</button>
        <div class="error-text" id="authErrorText"></div>
      </form>
    </div>
  </div>

  <div id="appShell" style="display:none;">
    <header class="topbar">
      <div>
        <h1>调度员端 · 线路、车辆（1–9号车）与司机指派管理</h1>
        <div class="topbar-meta" id="syncStatusText">数据已就绪</div>
      </div>
      <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap;">
        <span id="currentUserBadge" style="font-size:12.5px;color:#374151;font-weight:600;"></span>
        <a class="btn" href="./driver.html" target="_blank" rel="noopener noreferrer">打开司机端页面</a>
        <button class="btn btn-primary" type="button" onclick="refreshFromStore()">刷新状态</button>
        <button class="btn" type="button" onclick="logoutDispatcher()">退出登录</button>
      </div>
    </header>

    <div class="layout">
      <div class="left-sticky">
        <section class="panel">
          <h2 class="panel-title">新建 / 编辑长者（会员）卡片</h2>
          <form id="memberForm" onsubmit="saveMember(event)">
            <input type="hidden" id="editingMemberId" />
            <div class="form-group">
              <label for="mName">姓名 *</label>
              <input class="input" id="mName" required placeholder="例如：张建华" />
            </div>
            <div class="form-group">
              <label for="mPhone">联系电话 *</label>
              <input class="input" id="mPhone" required placeholder="例如：713-555-0199" />
            </div>
            <div class="form-group">
              <label for="mAddress">接送 / 送餐地址 *</label>
              <input class="input" id="mAddress" required placeholder="例如：6501 Westline Dr, Houston, TX 77036" />
            </div>
            <div class="form-group">
              <label for="mSpecial">特殊需要（如轮椅、需送上门）</label>
              <input class="input" id="mSpecial" placeholder="例如：轮椅、需送上门" />
            </div>
            <div class="form-group">
              <label for="mNotes">备注说明</label>
              <input class="input" id="mNotes" placeholder="例如：先电话联系家属" />
            </div>
            <div style="display:flex;gap:8px;">
              <button class="btn btn-primary" type="submit" style="flex:1;">保存卡片</button>
              <button class="btn" type="button" onclick="resetMemberForm()">清空</button>
            </div>
          </form>
        </section>

        <section class="panel pool-panel">
          <h2 class="panel-title">
            <span>人员卡片池</span>
            <span id="poolCountText" style="font-size:12px;color:var(--muted);font-weight:400;">可独立滚动并拖拽</span>
          </h2>
          <div class="search-box">
            <input
              type="text"
              class="input"
              id="memberSearchInput"
              placeholder="搜索姓名、电话、地址、特殊需要..."
              oninput="renderMemberPool()"
            />
            <button type="button" class="btn" onclick="clearMemberSearch()">清空</button>
          </div>
          <div class="pool-scroll" id="memberPoolList"></div>
        </section>
      </div>

      <div>
        <section class="panel">
          <h2 class="panel-title">
            <span>线路排班 · 日期发车时间、临时指定车辆与指定司机</span>
            <span style="font-size:12px;color:var(--muted);font-weight:400;">司机确认状态后此处自动同步更新</span>
          </h2>

          <div class="toolbar-row">
            <div class="toolbar-group">
              <label>
                统一日期：
                <input type="date" class="input input-sm" id="batchDateInput" />
              </label>
              <label>
                统一发车时间：
                <input type="time" class="input input-sm" id="batchTimeInput" value="08:00" />
              </label>
              <button class="btn btn-primary" type="button" style="padding:6px 10px;font-size:12.5px;" onclick="applyBatchSchedule()">
                应用到所有线路
              </button>
            </div>
            <div class="toolbar-group">
              <button class="btn" type="button" style="padding:6px 10px;font-size:12.5px;" onclick="toggleDriverManager()">
                司机管理
              </button>
              <button class="btn btn-primary" type="button" style="padding:6px 10px;font-size:12.5px;" onclick="addRoute()">
                + 新增线路
              </button>
            </div>
          </div>

          <div class="driver-manager-box" id="driverManagerBox" style="display:none;">
            <div style="font-size:13.5px;font-weight:700;margin-bottom:8px;">司机名单管理（增减与改名）</div>
            <div class="driver-add-row">
              <input
                type="text"
                class="input input-sm"
                id="newDriverNameInput"
                placeholder="输入新司机姓名，如：周师傅"
                style="flex:1;min-width:180px;"
                onkeydown="if(event.key==='Enter'){event.preventDefault();addDriver();}"
              />
              <button class="btn btn-primary" type="button" style="padding:6px 12px;font-size:12.5px;" onclick="addDriver()">
                + 添加司机
              </button>
            </div>
            <div class="driver-list-grid" id="driverManageList"></div>
          </div>

          <div class="routes-grid" id="routesGrid"></div>
        </section>
      </div>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
  <script src="./firebase-config.js"></script>
  <script>
    const VEHICLES = ['1号车', '2号车', '3号车', '4号车', '5号车', '6号车', '7号车', '8号车', '9号车'];
    const NO_PICKUP_VALUE = '__NO_PICKUP__';
    const DB_ROOT_PATH = 'fleetDispatchState';

    let auth = null;
    let db = null;
    let dbRef = null;
    let state = null;
    let draggedMemberId = null;
    let isSubscribed = false;
    let driverManagerOpen = false;

    function escapeHtml(str) {
      return String(str ?? '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    function escapeAttr(str) {
      return escapeHtml(str);
    }

    function getDefaultState() {
      const base = (window.FleetSync && window.FleetSync.DEFAULT_STATE)
        ? JSON.parse(JSON.stringify(window.FleetSync.DEFAULT_STATE))
        : {
            drivers: [
              { id: 'd1', name: '陈师傅' },
              { id: 'd2', name: '李师傅' },
              { id: 'd3', name: '王师傅' }
            ],
            members: [],
            routes: [
              { id: 'r1', lineName: '1号线', vehicleNo: '1号车', assignedDriverId: 'd1', dispatchDate: '', departureTime: '08:00', stops: [] },
              { id: 'r2', lineName: '2号线', vehicleNo: '2号车', assignedDriverId: 'd2', dispatchDate: '', departureTime: '08:00', stops: [] },
              { id: 'r3', lineName: '3号线', vehicleNo: '3号车', assignedDriverId: 'd3', dispatchDate: '', departureTime: '08:00', stops: [] }
            ]
          };
      base.updatedAt = base.updatedAt || new Date().toISOString();
      return base;
    }

    function ensureFirebaseReady() {
      if (auth && db) return true;

      const fs = window.FleetSync || {};
      const rawCfg =
        window.FIREBASE_CONFIG ||
        fs.FIREBASE_CONFIG ||
        fs.firebaseConfig ||
        fs.config ||
        (firebase.apps.length && firebase.app().options) ||
        {};

      const cfg = {
        apiKey: rawCfg.apiKey,
        authDomain: rawCfg.authDomain || 'fleet-dispatch-tx.firebaseapp.com',
        databaseURL:
          rawCfg.databaseURL ||
          'https://fleet-dispatch-tx-default-rtdb.firebaseio.com',
        projectId: rawCfg.projectId || 'fleet-dispatch-tx',
        storageBucket: rawCfg.storageBucket,
        messagingSenderId: rawCfg.messagingSenderId,
        appId: rawCfg.appId
      };

      if (!cfg.apiKey || cfg.apiKey === 'YOUR_FIREBASE_API_KEY') {
        document.getElementById('authErrorText').textContent =
          '未检测到有效的 Firebase apiKey，请先在 firebase-config.js 中填入真实配置。';
        return false;
      }

      if (!firebase.apps.length) {
        firebase.initializeApp(cfg);
      }
      auth = firebase.auth();
      db = firebase.database();
      dbRef = db.ref(DB_ROOT_PATH);
      return true;
    }

    function getTodayDateStr() {
      const now = new Date();
      const y = now.getFullYear();
      const m = String(now.getMonth() + 1).padStart(2, '0');
      const d = String(now.getDate()).padStart(2, '0');
      return `${y}-${m}-${d}`;
    }

    function normalizeState(raw) {
      const fallback = getDefaultState();
      const next = Object.assign({}, fallback, raw || {});
      next.drivers = Array.isArray(next.drivers) ? next.drivers : [];
      next.members = Array.isArray(next.members) ? next.members : [];
      next.routes = Array.isArray(next.routes) ? next.routes : [];

      const defaultDate = getTodayDateStr();
      next.routes.forEach((r, idx) => {
        if (!r.id) r.id = `r-${idx + 1}`;
        if (!r.lineName) r.lineName = `${idx + 1}号线`;
        if (!r.dispatchDate) r.dispatchDate = defaultDate;
        if (!r.departureTime) r.departureTime = '08:00';
        if (!Array.isArray(r.stops)) r.stops = [];
      });

      const dateEl = document.getElementById('batchDateInput');
      const timeEl = document.getElementById('batchTimeInput');
      if (dateEl && !dateEl.value) {
        dateEl.value = (next.routes[0] && next.routes[0].dispatchDate) || defaultDate;
      }
      if (timeEl && !timeEl.value) {
        timeEl.value = (next.routes[0] && next.routes[0].departureTime) || '08:00';
      }
      return next;
    }

    function showToast(msg) {
      const el = document.getElementById('toast');
      el.textContent = msg;
      el.classList.add('show');
      clearTimeout(window.__dToast);
      window.__dToast = setTimeout(() => el.classList.remove('show'), 2200);
    }

    function formatShortTime(iso) {
      if (!iso) return '';
      return new Date(iso).toLocaleTimeString('zh-CN', { hour12: false });
    }

    async function loadCloudState() {
      const snap = await dbRef.once('value');
      const val = snap.val();
      if (!val) {
        const initial = normalizeState(getDefaultState());
        await dbRef.set(initial);
        return initial;
      }
      return normalizeState(val);
    }

    async function persist(msg) {
      state = normalizeState(state);
      state.updatedAt = new Date().toISOString();
      await dbRef.set(state);
      renderAll();
      if (msg) showToast(msg);
    }

    async function refreshFromStore() {
      state = await loadCloudState();
      renderAll();
      showToast('已同步最新状态');
    }

    async function logoutDispatcher() {
      if (auth) await auth.signOut();
    }

    function toggleDriverManager() {
      driverManagerOpen = !driverManagerOpen;
      document.getElementById('driverManagerBox').style.display = driverManagerOpen ? 'block' : 'none';
      if (driverManagerOpen) renderDriverManager();
    }

    function getNextRouteName() {
      const used = new Set((state.routes || []).map(r => String(r.lineName || '').trim()));
      let n = 1;
      while (used.has(`${n}号线`)) {
        n += 1;
      }
      return `${n}号线`;
    }

    async function addRoute() {
      const lineName = getNextRouteName();
      const defaultDate = document.getElementById('batchDateInput').value || getTodayDateStr();
      const defaultTime = document.getElementById('batchTimeInput').value || '08:00';
      const nextIndex = (state.routes || []).length;
      const defaultVehicle = VEHICLES[nextIndex % VEHICLES.length] || '';
      const newRoute = {
        id: 'rt-' + Date.now() + '-' + Math.random().toString(36).slice(2, 6),
        lineName,
        vehicleNo: defaultVehicle,
        assignedDriverId: '',
        dispatchDate: defaultDate,
        departureTime: defaultTime,
        stops: []
      };
      state.routes.push(newRoute);
      await persist(`已新增 ${lineName}`);
    }

    async function deleteRoute(routeId) {
      const route = state.routes.find(r => r.id === routeId);
      if (!route) return;
      const stopCount = (route.stops || []).length;
      const tip = stopCount > 0
        ? `确定删除「${route.lineName}」吗？该线路当前有 ${stopCount} 个站点将被一并移除。`
        : `确定删除「${route.lineName}」吗？`;
      if (!confirm(tip)) return;
      state.routes = state.routes.filter(r => r.id !== routeId);
      await persist(`已删除 ${route.lineName}`);
    }

    async function addDriver() {
      const input = document.getElementById('newDriverNameInput');
      const name = (input.value || '').trim();
      if (!name) {
        showToast('请先输入司机姓名');
        return;
      }
      const newDriver = {
        id: 'drv-' + Date.now() + '-' + Math.random().toString(36).slice(2, 6),
        name
      };
      state.drivers.push(newDriver);
      input.value = '';
      await persist(`已添加司机：${name}`);
    }

    async function renameDriver(driverId, nextName) {
      const trimmed = String(nextName || '').trim();
      const driver = state.drivers.find(d => d.id === driverId);
      if (!driver || !trimmed || driver.name === trimmed) return;
      driver.name = trimmed;
      await persist(`已更新司机姓名为：${trimmed}`);
    }

    async function deleteDriver(driverId) {
      const driver = state.drivers.find(d => d.id === driverId);
      if (!driver) return;
      if (!confirm(`确定删除司机「${driver.name}」吗？已指派给该司机的线路将变为“未指定司机”。`)) return;
      state.drivers = state.drivers.filter(d => d.id !== driverId);
      state.routes.forEach(r => {
        if (r.assignedDriverId === driverId) {
          r.assignedDriverId = '';
        }
      });
      await persist(`已删除司机：${driver.name}`);
    }

    async function updateRouteSchedule(routeId, field, value) {
      const route = state.routes.find(r => r.id === routeId);
      if (!route) return;
      route[field] = value;
      await persist(`${route.lineName} 已更新为 ${route.dispatchDate || ''} ${route.departureTime || ''}`.trim());
    }

    async function applyBatchSchedule() {
      const dateVal = document.getElementById('batchDateInput').value;
      const timeVal = document.getElementById('batchTimeInput').value;
      if (!dateVal && !timeVal) {
        showToast('请先选择日期或发车时间');
        return;
      }
      state.routes.forEach(r => {
        if (dateVal) r.dispatchDate = dateVal;
        if (timeVal) r.departureTime = timeVal;
      });
      await persist(`已将所有线路设为 ${dateVal || ''} ${timeVal || ''}`.trim());
    }

    function resetMemberForm() {
      document.getElementById('editingMemberId').value = '';
      document.getElementById('memberForm').reset();
    }

    function editMember(memberId) {
      const m = state.members.find(item => item.id === memberId);
      if (!m) return;
      document.getElementById('editingMemberId').value = m.id;
      document.getElementById('mName').value = m.name || '';
      document.getElementById('mPhone').value = m.phone || '';
      document.getElementById('mAddress').value = m.address || '';
      document.getElementById('mSpecial').value = m.specialNeeds || '';
      document.getElementById('mNotes').value = m.notes || '';
      document.getElementById('mName').focus();
    }

    async function saveMember(e) {
      e.preventDefault();
      const editId = document.getElementById('editingMemberId').value;
      const existing = editId ? state.members.find(m => m.id === editId) : null;
      const payload = {
        id: editId || ('m-' + Date.now()),
        name: document.getElementById('mName').value.trim(),
        phone: document.getElementById('mPhone').value.trim(),
        address: document.getElementById('mAddress').value.trim(),
        specialNeeds: document.getElementById('mSpecial').value.trim(),
        notes: document.getElementById('mNotes').value.trim(),
        noPickup: existing ? Boolean(existing.noPickup) : false
      };
      if (editId) {
        const idx = state.members.findIndex(m => m.id === editId);
        if (idx !== -1) state.members[idx] = payload;
      } else {
        state.members.unshift(payload);
      }
      resetMemberForm();
      await persist(editId ? '已更新卡片信息' : '已新增卡片信息');
    }

    async function deleteMember(memberId) {
      state.members = state.members.filter(m => m.id !== memberId);
      state.routes.forEach(r => {
        r.stops = (r.stops || []).filter(s => s.memberId !== memberId);
      });
      await persist('已删除卡片');
    }

    async function setMemberNoPickup(memberId, enabled) {
      const member = state.members.find(m => m.id === memberId);
      if (!member) return;
      member.noPickup = enabled;
      if (enabled) {
        state.routes.forEach(r => {
          r.stops = (r.stops || []).filter(s => s.memberId !== memberId);
        });
      }
      await persist(enabled ? `已标记 ${member.name} 为无需接送（自驾或亲友接送）` : `已取消 ${member.name} 的无需接送标记`);
    }

    async function handleMemberRouteSelect(memberId, selectedValue) {
      if (!selectedValue) return;
      if (selectedValue === NO_PICKUP_VALUE) {
        await setMemberNoPickup(memberId, true);
        return;
      }
      await addMemberToRoute(memberId, selectedValue);
    }

    async function addMemberToRoute(memberId, routeId) {
      const route = state.routes.find(r => r.id === routeId);
      if (!route) return;
      const member = state.members.find(m => m.id === memberId);
      if (member && member.noPickup) {
        member.noPickup = false;
      }
      route.stops = route.stops || [];
      route.stops.push({
        memberId,
        pickedUp: false,
        mealDelivered: false,
        updatedAt: ''
      });
      await persist(`已加入 ${route.lineName}`);
    }

    async function moveStop(routeId, index, delta) {
      const route = state.routes.find(r => r.id === routeId);
      if (!route || !route.stops) return;
      const target = index + delta;
      if (target < 0 || target >= route.stops.length) return;
      const temp = route.stops[index];
      route.stops[index] = route.stops[target];
      route.stops[target] = temp;
      await persist('已调整接送顺序');
    }

    async function removeStop(routeId, index) {
      const route = state.routes.find(r => r.id === routeId);
      if (!route || !route.stops) return;
      route.stops.splice(index, 1);
      await persist('已从线路移除该站点');
    }

    async function updateRouteVehicle(routeId, vehicleNo) {
      const route = state.routes.find(r => r.id === routeId);
      if (!route) return;
      route.vehicleNo = vehicleNo;
      await persist(`${route.lineName} 临时指定为 ${vehicleNo || '未指定车辆'}`);
    }

    async function updateRouteDriver(routeId, driverId) {
      const route = state.routes.find(r => r.id === routeId);
      if (!route) return;
      route.assignedDriverId = driverId;
      const drv = state.drivers.find(d => d.id === driverId);
      await persist(`${route.lineName} 已指定司机：${drv ? drv.name : '未指定司机'}`);
    }

    function getAssignedRouteNames(memberId) {
      const names = [];
      (state.routes || []).forEach(r => {
        if ((r.stops || []).some(s => s.memberId === memberId)) {
          names.push(r.lineName);
        }
      });
      return names;
    }

    function clearMemberSearch() {
      const input = document.getElementById('memberSearchInput');
      if (input) input.value = '';
      renderMemberPool();
    }

    function renderDriverManager() {
      const container = document.getElementById('driverManageList');
      if (!container) return;
      const drivers = state.drivers || [];
      if (!drivers.length) {
        container.innerHTML = `<div style="font-size:12.5px;color:var(--muted);">暂无司机，请在上方添加。</div>`;
        return;
      }
      container.innerHTML = drivers.map(d => `
        <div class="driver-item">
          <input
            type="text"
            class="input input-sm"
            style="flex:1;min-width:90px;"
            value="${escapeAttr(d.name || '')}"
            onchange="renameDriver('${escapeAttr(d.id)}', this.value)"
          />
          <button type="button" class="btn btn-danger" style="padding:4px 8px;font-size:11.5px;" onclick="deleteDriver('${escapeAttr(d.id)}')">删除</button>
        </div>
      `).join('');
    }

    function renderMemberPool() {
      const container = document.getElementById('memberPoolList');
      const searchInput = document.getElementById('memberSearchInput');
      const countEl = document.getElementById('poolCountText');
      const keyword = (searchInput ? searchInput.value : '').trim().toLowerCase();

      const allMembers = state.members || [];
      const filtered = keyword
        ? allMembers.filter(m => {
            const hay = [m.name, m.phone, m.address, m.specialNeeds, m.notes]
              .map(v => String(v || '').toLowerCase())
              .join(' ');
            return hay.includes(keyword);
          })
        : allMembers;

      if (countEl) {
        countEl.textContent = keyword
          ? `筛选 ${filtered.length} / ${allMembers.length} 张`
          : `共 ${allMembers.length} 张 · 可拖拽`;
      }

      const routeOptions = (state.routes || [])
        .map(r => `<option value="${escapeAttr(r.id)}">${escapeHtml(r.lineName)}</option>`)
        .join('');

      if (!filtered.length) {
        container.innerHTML = `
          <div style="padding:18px 10px;text-align:center;color:var(--muted);font-size:12.5px;border:1px dashed #d1d5db;border-radius:10px;">
            ${keyword ? '没有匹配的人员卡片' : '暂无人员卡片，请在上方新建'}
          </div>
        `;
        return;
      }

      container.innerHTML = filtered.map(m => {
        const assignedLines = getAssignedRouteNames(m.id);
        let routeBadgeHtml = '';
        if (assignedLines.length > 0) {
          routeBadgeHtml = `<span class="route-status-badge assigned">已排：${escapeHtml(assignedLines.join('、'))}</span>`;
        } else if (m.noPickup) {
          routeBadgeHtml = `<span class="route-status-badge self-transport">无需接送（自驾或亲友接送）</span>`;
        } else {
          routeBadgeHtml = `<span class="route-status-badge unassigned">未排线路</span>`;
        }

        const safeId = escapeAttr(m.id);
        return `
          <div class="member-card" draggable="true" ondragstart="draggedMemberId='${safeId}'">
            <div class="member-head">
              <span>${escapeHtml(m.name)}</span>
              <span style="font-size:12px;color:var(--muted);font-weight:400;">${escapeHtml(m.phone || '')}</span>
            </div>
            <div>
              ${routeBadgeHtml}
              ${m.specialNeeds ? `<span class="tag">特殊需要：${escapeHtml(m.specialNeeds)}</span>` : ''}
            </div>
            <div class="member-detail">${escapeHtml(m.address || '')}</div>
            ${m.notes ? `<div class="member-detail" style="color:#6b7280;">备注：${escapeHtml(m.notes)}</div>` : ''}
            <div class="member-actions">
              <select class="select" style="width:auto;padding:5px 8px;font-size:12px;" onchange="if(this.value){handleMemberRouteSelect('${safeId}', this.value); this.value='';}">
                <option value="">+ 加入线路...</option>
                ${routeOptions}
                <option value="${NO_PICKUP_VALUE}">无需接送（自驾或亲友接送）</option>
              </select>
              ${m.noPickup ? `<button class="btn" type="button" style="padding:5px 8px;font-size:12px;" onclick="setMemberNoPickup('${safeId}', false)">恢复待排</button>` : ''}
              <button class="btn" type="button" style="padding:5px 8px;font-size:12px;" onclick="editMember('${safeId}')">编辑</button>
              <button class="btn btn-danger" type="button" style="padding:5px 8px;font-size:12px;" onclick="deleteMember('${safeId}')">删除</button>
            </div>
          </div>
        `;
      }).join('');
    }

    function renderRoutes() {
      const container = document.getElementById('routesGrid');
      const memberMap = new Map((state.members || []).map(m => [m.id, m]));

      if (!state.routes || state.routes.length === 0) {
        container.innerHTML = `
          <div style="grid-column:1/-1;padding:24px;text-align:center;color:var(--muted);border:1px dashed #cbd5e1;border-radius:12px;">
            当前暂无线路，点击上方「+ 新增线路」开始排班。
          </div>
        `;
        return;
      }

      container.innerHTML = state.routes.map(route => {
        const safeRouteId = escapeAttr(route.id);
        const vehicleOptions = [`<option value="">未指定车辆</option>`]
          .concat(VEHICLES.map(v => `<option value="${escapeAttr(v)}" ${route.vehicleNo === v ? 'selected' : ''}>${escapeHtml(v)}</option>`))
          .join('');

        const driverOptions = [`<option value="">未指定司机</option>`]
          .concat((state.drivers || []).map(d => `<option value="${escapeAttr(d.id)}" ${route.assignedDriverId === d.id ? 'selected' : ''}>${escapeHtml(d.name || '')}</option>`))
          .join('');

        const stopsHtml = (!route.stops || route.stops.length === 0)
          ? `<div style="padding:18px 8px;text-align:center;color:var(--muted);font-size:12.5px;border:1px dashed #d1d5db;border-radius:8px;">
               拖入卡片或从左侧「+ 加入线路」添加站点
             </div>`
          : route.stops.map((stop, idx) => {
              const m = memberMap.get(stop.memberId);
              if (!m) return '';
              const timeStr = stop.updatedAt ? ` · ${formatShortTime(stop.updatedAt)}` : '';
              return `
                <div class="stop-item">
                  <div class="stop-item-top">
                    <span>#${idx + 1} ${escapeHtml(m.name)}</span>
                    <div style="display:flex;gap:4px;">
                      <button class="btn" type="button" style="padding:2px 6px;font-size:11px;" onclick="moveStop('${safeRouteId}', ${idx}, -1)" ${idx === 0 ? 'disabled' : ''}>↑</button>
                      <button class="btn" type="button" style="padding:2px 6px;font-size:11px;" onclick="moveStop('${safeRouteId}', ${idx}, 1)" ${idx === route.stops.length - 1 ? 'disabled' : ''}>↓</button>
                      <button class="btn btn-danger" type="button" style="padding:2px 6px;font-size:11px;" onclick="removeStop('${safeRouteId}', ${idx})">移出</button>
                    </div>
                  </div>
                  <div style="font-size:12px;color:#4b5563;margin-top:3px;">${escapeHtml(m.address || '')}</div>
                  ${m.specialNeeds ? `<span class="tag">${escapeHtml(m.specialNeeds)}</span>` : ''}
                  <div class="status-row">
                    <span class="status-pill ${stop.pickedUp ? 'ok' : ''}">${stop.pickedUp ? '✓ 已接送' : '待接送'}</span>
                    <span class="status-pill ${stop.mealDelivered ? 'ok' : ''}">${stop.mealDelivered ? '✓ 餐食已送达' : '餐食待送达'}</span>
                    ${timeStr ? `<span style="font-size:11px;color:var(--muted);">${escapeHtml(timeStr)}</span>` : ''}
                  </div>
                </div>
              `;
            }).join('');

        return `
          <div class="route-card"
            ondragover="event.preventDefault(); this.classList.add('drag-over');"
            ondragleave="this.classList.remove('drag-over');"
            ondrop="event.preventDefault(); this.classList.remove('drag-over'); if(draggedMemberId){ addMemberToRoute(draggedMemberId, '${safeRouteId}'); draggedMemberId = null; }">
            <div class="route-top">
              <span class="route-name">${escapeHtml(route.lineName)}</span>
              <div style="display:flex;align-items:center;gap:8px;">
                <span style="font-size:12px;color:var(--muted);">共 ${(route.stops || []).length} 站</span>
                <button class="btn btn-danger" type="button" style="padding:3px 8px;font-size:11.5px;" onclick="deleteRoute('${safeRouteId}')">删除</button>
              </div>
            </div>
            <div class="schedule-controls">
              <div>
                <label style="display:block;font-size:11.5px;color:#334155;font-weight:600;margin-bottom:3px;">日期</label>
                <input type="date" class="input" style="padding:6px 8px;font-size:12.5px;" value="${escapeAttr(route.dispatchDate || '')}" onchange="updateRouteSchedule('${safeRouteId}', 'dispatchDate', this.value)" />
              </div>
              <div>
                <label style="display:block;font-size:11.5px;color:#334155;font-weight:600;margin-bottom:3px;">发车时间</label>
                <input type="time" class="input" style="padding:6px 8px;font-size:12.5px;" value="${escapeAttr(route.departureTime || '')}" onchange="updateRouteSchedule('${safeRouteId}', 'departureTime', this.value)" />
              </div>
            </div>
            <div class="assign-controls">
              <div>
                <label style="display:block;font-size:11.5px;color:var(--muted);margin-bottom:3px;">临时指定车辆</label>
                <select class="select" onchange="updateRouteVehicle('${safeRouteId}', this.value)">
                  ${vehicleOptions}
                </select>
              </div>
              <div>
                <label style="display:block;font-size:11.5px;color:var(--muted);margin-bottom:3px;">临时指定司机</label>
                <select class="select" onchange="updateRouteDriver('${safeRouteId}', this.value)">
                  ${driverOptions}
                </select>
              </div>
            </div>
            <div>${stopsHtml}</div>
          </div>
        `;
      }).join('');
    }

    function renderAll() {
      if (!state) return;
      document.getElementById('syncStatusText').textContent =
        `最近更新：${new Date(state.updatedAt || Date.now()).toLocaleString('zh-CN')} · Firebase 云端已认证同步`;
      if (driverManagerOpen) renderDriverManager();
      renderMemberPool();
      renderRoutes();
    }

    document.getElementById('dispatcherLoginForm').addEventListener('submit', async function (e) {
      e.preventDefault();
      const errEl = document.getElementById('authErrorText');
      const btn = document.getElementById('loginSubmitBtn');
      errEl.textContent = '';
      if (!ensureFirebaseReady()) return;

      const email = document.getElementById('loginEmail').value.trim();
      const password = document.getElementById('loginPassword').value;
      btn.disabled = true;
      btn.textContent = '登录中...';
      try {
        await auth.signInWithEmailAndPassword(email, password);
      } catch (err) {
        errEl.textContent = '登录失败：请检查邮箱或密码是否正确（' + (err && err.code ? err.code : '认证错误') + '）。';
      } finally {
        btn.disabled = false;
        btn.textContent = '登录调度员端';
      }
    });

    (function initAuthWatcher() {
      if (!ensureFirebaseReady()) return;
      auth.onAuthStateChanged(async (user) => {
        if (!user) {
          document.getElementById('appShell').style.display = 'none';
          document.getElementById('authScreen').style.display = 'flex';
          document.getElementById('currentUserBadge').textContent = '';
          return;
        }
        document.getElementById('authScreen').style.display = 'none';
        document.getElementById('appShell').style.display = 'block';
        document.getElementById('currentUserBadge').textContent = '已登录：' + (user.email || '');

        try {
          state = await loadCloudState();
          renderAll();
          if (!isSubscribed) {
            isSubscribed = true;
            dbRef.on('value', (snap) => {
              const val = snap.val();
              if (!val) return;
              state = normalizeState(val);
              renderAll();
            });
          }
        } catch (err) {
          showToast('读取云端数据失败，请检查数据库规则');
        }
      });
    })();
  </script>
</body>
</html>
