<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>调度员端 · 常规路线与临时路线管理</title>
  <style>
    :root {
      --bg: #f3f5f8;
      --card: #ffffff;
      --text: #111827;
      --muted: #6b7280;
      --primary: #1d4ed8;
      --primary-soft: #eff6ff;
      --amber: #b45309;
      --amber-soft: #fffbeb;
      --amber-border: #fcd34d;
      --border: #e5e7eb;
      --success: #047857;
      --success-soft: #ecfdf5;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
      background: var(--bg);
      color: var(--text);
      padding-bottom: 48px;
    }
    .auth-overlay {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 18px;
    }
    .auth-card {
      width: 100%;
      max-width: 400px;
      background: #fff;
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 24px;
      box-shadow: 0 10px 25px rgba(15, 23, 42, 0.06);
    }
    .auth-title { margin: 0 0 6px; font-size: 20px; font-weight: 800; }
    .auth-sub { margin: 0 0 16px; font-size: 13px; color: var(--muted); line-height: 1.5; }
    .topbar {
      background: #fff;
      border-bottom: 1px solid var(--border);
      padding: 14px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 10px;
    }
    .topbar h1 { margin: 0; font-size: 19px; }
    .topbar-meta { font-size: 13px; color: var(--muted); }
    .layout {
      max-width: 1440px;
      margin: 18px auto;
      padding: 0 18px;
      display: grid;
      grid-template-columns: 360px 1fr;
      gap: 18px;
      align-items: start;
    }
    .left-sticky {
      position: sticky;
      top: 16px;
      max-height: calc(100vh - 32px);
      display: flex;
      flex-direction: column;
      gap: 14px;
    }
    .right-stack {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    @media (max-width: 980px) {
      .layout { grid-template-columns: 1fr; }
      .left-sticky { position: static; max-height: none; }
    }
    .panel {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 16px;
    }
    .pool-panel {
      display: flex;
      flex-direction: column;
      min-height: 220px;
      max-height: 46vh;
      overflow: hidden;
    }
    .pool-scroll {
      overflow-y: auto;
      padding-right: 4px;
      flex: 1;
    }
    .panel-title {
      margin: 0 0 12px;
      font-size: 16px;
      font-weight: 700;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px;
    }
    .toolbar-row {
      background: #f8fafc;
      border: 1px solid #e2e8f0;
      border-radius: 10px;
      padding: 10px 12px;
      margin-bottom: 12px;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }
    .toolbar-group {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 8px;
    }
    .manager-box {
      background: #f9fafb;
      border: 1px solid #e5e7eb;
      border-radius: 10px;
      padding: 12px;
      margin-bottom: 14px;
    }
    .manager-add-row {
      display: flex;
      gap: 8px;
      margin-bottom: 10px;
      flex-wrap: wrap;
    }
    .manager-list-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
      gap: 8px;
    }
    .manager-item {
      background: #fff;
      border: 1px solid #e5e7eb;
      border-radius: 8px;
      padding: 7px 9px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .form-group { margin-bottom: 10px; }
    .form-group label {
      display: block;
      font-size: 12.5px;
      font-weight: 600;
      margin-bottom: 4px;
      color: #374151;
    }
    .input, .select {
      width: 100%;
      padding: 8px 10px;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      font-size: 13.5px;
      background: #fff;
    }
    .input-sm {
      width: auto;
      padding: 6px 8px;
      font-size: 12.5px;
    }
    .btn {
      border: 1px solid var(--border);
      background: #fff;
      color: var(--text);
      border-radius: 8px;
      padding: 7px 11px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      text-decoration: none;
      display: inline-block;
    }
    .btn-primary {
      background: var(--primary);
      border-color: var(--primary);
      color: #fff;
    }
    .btn-amber {
      background: #d97706;
      border-color: #d97706;
      color: #fff;
    }
    .btn-block {
      width: 100%;
      padding: 11px;
      font-size: 15px;
    }
    .btn-danger {
      color: #b91c1c;
      border-color: #fecaca;
      background: #fef2f2;
    }
    .search-box {
      display: flex;
      gap: 6px;
      margin-bottom: 10px;
      align-items: center;
    }
    .member-card {
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 10px 12px;
      margin-bottom: 10px;
      background: #fafafa;
      cursor: grab;
    }
    .member-card:active { cursor: grabbing; }
    .member-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-weight: 700;
      font-size: 14.5px;
    }
    .route-status-badge {
      display: inline-block;
      margin-top: 5px;
      margin-right: 6px;
      font-size: 11.5px;
      font-weight: 600;
      padding: 2px 8px;
      border-radius: 999px;
    }
    .route-status-badge.assigned {
      background: var(--primary-soft);
      color: var(--primary);
      border: 1px solid #bfdbfe;
    }
    .route-status-badge.self-transport {
      background: var(--success-soft);
      color: var(--success);
      border: 1px solid #a7f3d0;
    }
    .route-status-badge.unassigned {
      background: #f3f4f6;
      color: #6b7280;
      border: 1px solid #e5e7eb;
    }
    .tag {
      display: inline-block;
      margin-top: 5px;
      background: #fef2f2;
      color: #b91c1c;
      border: 1px solid #fecaca;
      font-size: 11.5px;
      padding: 2px 7px;
      border-radius: 5px;
    }
    .member-detail {
      font-size: 12.5px;
      color: #4b5563;
      margin-top: 4px;
      line-height: 1.4;
    }
    .member-actions {
      margin-top: 8px;
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
    }
    .regular-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .regular-item {
      border: 1.5px solid var(--border);
      border-radius: 12px;
      background: #fff;
      overflow: hidden;
    }
    .regular-item.drag-over {
      border-color: var(--primary);
      background: var(--primary-soft);
    }
    .regular-header {
      padding: 10px 14px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
      background: #f9fafb;
    }
    .regular-title-btn {
      background: transparent;
      border: none;
      padding: 0;
      font-size: 15px;
      font-weight: 800;
      color: var(--primary);
      cursor: pointer;
      text-align: left;
    }
    .regular-summary {
      font-size: 12.5px;
      color: #374151;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 8px;
    }
    .stage-pill {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 999px;
      font-size: 11.5px;
      font-weight: 700;
      background: var(--primary-soft);
      color: var(--primary);
    }
    .stage-pill.tomorrow {
      background: var(--amber-soft);
      color: var(--amber);
      border: 1px solid var(--amber-border);
    }
    .regular-body {
      padding: 12px 14px;
      border-top: 1px solid #eef2f6;
    }
    .schedule-grid-3 {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
      gap: 8px;
      margin-bottom: 10px;
      background: #f8fafc;
      padding: 10px;
      border-radius: 8px;
      border: 1px solid #e2e8f0;
    }
    .assign-controls {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-bottom: 10px;
    }
    .stop-item {
      border: 1px solid #e5e7eb;
      background: #f9fafb;
      border-radius: 8px;
      padding: 8px 10px;
      margin-bottom: 8px;
    }
    .stop-item-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 6px;
      font-weight: 700;
      font-size: 13.5px;
    }
    .status-row {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 6px;
      margin-top: 6px;
    }
    .status-pill {
      font-size: 11.5px;
      padding: 2px 7px;
      border-radius: 999px;
      background: #e5e7eb;
      color: #374151;
      display: inline-block;
    }
    .status-pill.ok {
      background: var(--success-soft);
      color: var(--success);
      font-weight: 600;
    }
    .adhoc-form-box {
      background: var(--amber-soft);
      border: 1.5px solid var(--amber-border);
      border-radius: 12px;
      padding: 14px;
      margin-bottom: 14px;
    }
    .adhoc-grid-2 {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 10px;
    }
    .adhoc-card {
      border: 1.5px solid var(--amber-border);
      background: #fffdf7;
      border-radius: 12px;
      padding: 12px;
      margin-bottom: 10px;
    }
    .adhoc-badge {
      display: inline-block;
      background: #fef3c7;
      color: var(--amber);
      border: 1px solid var(--amber-border);
      font-size: 11.5px;
      font-weight: 700;
      padding: 2px 8px;
      border-radius: 999px;
    }
    .passenger-chip {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      background: #fff;
      border: 1px solid #e5e7eb;
      border-radius: 8px;
      padding: 7px 10px;
      margin-bottom: 6px;
      font-size: 13px;
    }
    .table-wrap {
      overflow-x: auto;
      border: 1px solid var(--border);
      border-radius: 10px;
    }
    table.report-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 12.5px;
      background: #fff;
    }
    table.report-table th,
    table.report-table td {
      padding: 8px 10px;
      border-bottom: 1px solid #eef2f6;
      text-align: left;
      white-space: nowrap;
    }
    table.report-table th {
      background: #f8fafc;
      font-weight: 700;
      color: #334155;
    }
    .error-text {
      color: #b91c1c;
      font-size: 13px;
      margin-top: 8px;
      min-height: 18px;
    }
    .toast {
      position: fixed;
      bottom: 18px;
      right: 18px;
      background: #111827;
      color: #fff;
      padding: 10px 16px;
      border-radius: 10px;
      font-size: 13px;
      z-index: 50;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s ease;
    }
    .toast.show { opacity: 1; }
  </style>
</head>
<body>
  <div class="auth-overlay" id="authScreen">
    <div class="auth-card">
      <h2 class="auth-title">调度员端登录</h2>
      <p class="auth-sub">请使用 Firebase 后台已创建的邮箱与密码登录，未授权账号无法访问排班与长者信息。</p>
      <form id="dispatcherLoginForm">
        <div class="form-group">
          <label for="loginEmail">登录邮箱</label>
          <input class="input" type="email" id="loginEmail" required autocomplete="username" placeholder="dispatcher@example.com" />
        </div>
        <div class="form-group">
          <label for="loginPassword">登录密码</label>
          <input class="input" type="password" id="loginPassword" required autocomplete="current-password" placeholder="请输入密码" />
        </div>
        <button class="btn btn-primary btn-block" type="submit" id="loginSubmitBtn">登录调度员端</button>
        <div class="error-text" id="authErrorText"></div>
      </form>
    </div>
  </div>

  <div id="appShell" style="display:none;">
    <header class="topbar">
      <div>
        <h1>调度员端 · 常规路线与临时路线管理</h1>
        <div class="topbar-meta" id="syncStatusText">数据已就绪</div>
      </div>
      <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap;">
        <span id="currentUserBadge" style="font-size:12.5px;color:#374151;font-weight:600;"></span>
        <a class="btn" href="./driver.html" target="_blank" rel="noopener noreferrer">打开司机端页面</a>
        <button class="btn btn-primary" type="button" onclick="refreshFromStore()">刷新状态</button>
        <button class="btn" type="button" onclick="logoutDispatcher()">退出登录</button>
      </div>
    </header>

    <div class="layout">
      <div class="left-sticky">
        <section class="panel">
          <h2 class="panel-title">新建 / 编辑长者（会员）卡片</h2>
          <form id="memberForm" onsubmit="saveMember(event)">
            <input type="hidden" id="editingMemberId" />
            <div class="form-group">
              <label for="mName">姓名 *</label>
              <input class="input" id="mName" required placeholder="例如：张建华" />
            </div>
            <div class="form-group">
              <label for="mPhone">联系电话 *</label>
              <input class="input" id="mPhone" required placeholder="例如：713-555-0199" />
            </div>
            <div class="form-group">
              <label for="mAddress">接送 / 送餐地址 *</label>
              <input class="input" id="mAddress" required placeholder="例如：6501 Westline Dr, Houston, TX 77036" />
            </div>
            <div class="form-group">
              <label for="mSpecial">特殊需要（如轮椅、需送上门）</label>
              <input class="input" id="mSpecial" placeholder="例如：轮椅、需送上门" />
            </div>
            <div class="form-group">
              <label for="mNotes">备注说明</label>
              <input class="input" id="mNotes" placeholder="例如：先电话联系家属" />
            </div>
            <div style="display:flex;gap:8px;">
              <button class="btn btn-primary" type="submit" style="flex:1;">保存卡片</button>
              <button class="btn" type="button" onclick="resetMemberForm()">清空</button>
            </div>
          </form>
        </section>

        <section class="panel pool-panel">
          <h2 class="panel-title">
            <span>人员卡片池</span>
            <span id="poolCountText" style="font-size:12px;color:var(--muted);font-weight:400;">可独立滚动并拖拽</span>
          </h2>
          <div class="search-box">
            <input
              type="text"
              class="input"
              id="memberSearchInput"
              placeholder="搜索姓名、电话、地址、特殊需要..."
              oninput="renderMemberPool()"
            />
            <button type="button" class="btn" onclick="clearMemberSearch()">清空</button>
          </div>
          <div class="pool-scroll" id="memberPoolList"></div>
        </section>
      </div>

      <div class="right-stack">
        <section class="panel" style="padding:12px 16px;">
          <div class="toolbar-row" style="margin-bottom:0;">
            <div class="toolbar-group">
              <strong style="font-size:13.5px;">资源配置：</strong>
              <button class="btn" type="button" style="padding:6px 10px;font-size:12.5px;" onclick="toggleVehicleManager()">
                车辆管理
              </button>
              <button class="btn" type="button" style="padding:6px 10px;font-size:12.5px;" onclick="toggleDriverManager()">
                司机管理
              </button>
            </div>
            <div style="font-size:12px;color:var(--muted);">
              上午接结束 → 自动推下午送；下午送结束 → 自动推明日上午接
            </div>
          </div>

          <div class="manager-box" id="vehicleManagerBox" style="display:none;margin-top:10px;margin-bottom:0;">
            <div style="font-size:13.5px;font-weight:700;margin-bottom:8px;">车辆名单管理</div>
            <div class="manager-add-row">
              <input
                type="text"
                class="input input-sm"
                id="newVehicleNameInput"
                placeholder="输入车号或车型，如：1号车 或 特斯拉"
                style="flex:1;min-width:190px;"
                onkeydown="if(event.key==='Enter'){event.preventDefault();addVehicle();}"
              />
              <button class="btn btn-primary" type="button" style="padding:6px 12px;font-size:12.5px;" onclick="addVehicle()">
                + 添加车辆
              </button>
            </div>
            <div class="manager-list-grid" id="vehicleManageList"></div>
          </div>

          <div class="manager-box" id="driverManagerBox" style="display:none;margin-top:10px;margin-bottom:0;">
            <div style="font-size:13.5px;font-weight:700;margin-bottom:8px;">司机名单管理（绑定登录邮箱用于严格隔离任务）</div>
            <div class="manager-add-row">
              <input
                type="text"
                class="input input-sm"
                id="newDriverNameInput"
                placeholder="司机姓名，如：周师傅"
                style="flex:1;min-width:150px;"
              />
              <input
                type="email"
                class="input input-sm"
                id="newDriverEmailInput"
                placeholder="司机登录邮箱，如：zhou@example.com"
                style="flex:1.2;min-width:200px;"
              />
              <button class="btn btn-primary" type="button" style="padding:6px 12px;font-size:12.5px;" onclick="addDriver()">
                + 添加司机
              </button>
            </div>
            <div class="manager-list-grid" id="driverManageList"></div>
          </div>
        </section>

        <section class="panel" id="regularRoutesSection">
          <h2 class="panel-title">
            <span>常规路线（共 7 条 · 默认折叠）</span>
            <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap;">
              <button class="btn" type="button" style="padding:5px 10px;font-size:12px;" onclick="setAllRegularCollapsed(true)">
                全部折叠
              </button>
              <button class="btn" type="button" style="padding:5px 10px;font-size:12px;" onclick="setAllRegularCollapsed(false)">
                全部展开
              </button>
              <button class="btn btn-primary" type="button" style="padding:5px 10px;font-size:12px;" onclick="resetAllRegularToTodayMorning()">
                重置为今日上午接
              </button>
            </div>
          </h2>
          <div class="regular-list" id="regularRoutesList"></div>
        </section>

        <section class="panel" id="adhocRoutesSection">
          <h2 class="panel-title">
            <span>临时路线（动态新增 · 实时派单）</span>
            <button class="btn btn-amber" type="button" style="padding:6px 12px;font-size:12.5px;" onclick="toggleAdhocForm()">
              + 新增临时路线
            </button>
          </h2>

          <div class="adhoc-form-box" id="adhocFormBox" style="display:none;">
            <form id="adhocRouteForm" onsubmit="saveAdhocRoute(event)">
              <input type="hidden" id="editingAdhocId" />
              <div class="adhoc-grid-2">
                <div class="form-group">
                  <label for="adhocName">1. 临时线路名称 *</label>
                  <input class="input" id="adhocName" required placeholder="例如：丰健伟诊所专车 / 午间临时接送" />
                </div>
                <div class="form-group">
                  <label for="adhocLocationSearch">2. 目的地选择（约50个常用地点）*</label>
                  <input
                    class="input"
                    id="adhocLocationSearch"
                    placeholder="输入关键词筛选常用地点，如：丰健伟、诊所、医院、超市..."
                    oninput="filterLocationSelect()"
                    style="margin-bottom:6px;"
                  />
                  <select class="select" id="adhocLocationSelect" onchange="onCommonLocationChange()">
                    <option value="">-- 请选择常用地点（自动带出详细地址） --</option>
                  </select>
                </div>
              </div>

              <div class="form-group">
                <label for="adhocAddress">目的地详细地址（选中常用地点后自动带出，支持必要时微调）*</label>
                <input class="input" id="adhocAddress" required placeholder="选择常用地点后自动填入地址，也可手动补充楼层/门牌" />
              </div>

              <div class="form-group">
                <label>3. 需接送长者选择（仅提取长者的“姓名”与“电话”，不修改原有长者档案）</label>
                <div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:8px;">
                  <select class="select" id="adhocMemberPicker" style="flex:1;min-width:220px;">
                    <option value="">-- 选择长者卡片加入接送顺序 --</option>
                  </select>
                  <button class="btn btn-primary" type="button" onclick="addSelectedMemberToAdhoc()">
                    + 加入接送顺序
                  </button>
                </div>
                <div id="adhocPassengerList"></div>
              </div>

              <div class="adhoc-grid-2">
                <div class="form-group">
                  <label for="adhocVehicle">4. 分配车辆 *</label>
                  <select class="select" id="adh
